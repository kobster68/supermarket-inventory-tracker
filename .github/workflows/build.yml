name: Build SAD

# Compile the architecture document on every push (any branch) and every pull
# request, so slice authors get the PDF artifact on each push. Reviewers read the
# uploaded main.pdf, not the diff.

on:
  push:
    branches: [ '**' ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Pinned, immutable TeX Live image (full scheme: pdflatex, latexmk, TeX Gyre
    # Termes, biblatex and biber are all present). PlantUML, Graphviz, rsvg-convert
    # and pdfinfo are added with apt below.
    container:
      image: texlive/texlive:TL2025-historic

    steps:
      - name: Install git (needed by actions/checkout)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install PlantUML, Graphviz, rsvg-convert, and pdfinfo
        run: |
          apt-get install -y --no-install-recommends \
            plantuml graphviz librsvg2-bin poppler-utils default-jre-headless
          rm -rf /var/lib/apt/lists/*

      - name: Build main.pdf
        # build.sh renders the diagrams, compiles the document, prints the page
        # count, and exits non-zero if main.pdf was not produced.
        run: bash scripts/build.sh

      - name: Lint
        run: bash scripts/lint.sh

      - name: Upload main.pdf
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-pdf
          path: main.pdf
          if-no-files-found: error
