name: Build SAD

# Compile the architecture document on every push (any branch) and every pull
# request, so slice authors get the PDF artifact on each push. Reviewers read the
# uploaded main.pdf, not the diff.

on:
  push:
    branches: [ '**' ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Pinned, immutable TeX Live image (full scheme: pdflatex, latexmk, TeX Gyre
    # Termes, biblatex and biber are all present). PlantUML, Graphviz, rsvg-convert
    # and pdfinfo are added with apt below.
    container:
      image: texlive/texlive:TL2025-historic

    steps:
      - name: Install git (needed by actions/checkout)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Trust the checkout directory
        # The checkout is owned by a different uid than the one running git in the
        # container, so git refuses it as "dubious ownership" and git grep exits 128.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install PlantUML, Graphviz, rsvg-convert, and pdfinfo
        run: |
          apt-get install -y --no-install-recommends \
            plantuml graphviz librsvg2-bin poppler-utils default-jre-headless
          rm -rf /var/lib/apt/lists/*

      - name: Build main.pdf
        # build.sh renders the diagrams, compiles the document, prints the page
        # count, and exits non-zero if main.pdf was not produced.
        run: bash scripts/build.sh

      - name: Lint
        run: bash scripts/lint.sh

      - name: Upload main.pdf
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-pdf
          path: main.pdf
          if-no-files-found: error

  publish-latest:
    # On every push to main that built green, attach that same main.pdf to a rolling
    # pre-release tagged "latest", so
    # https://github.com/kobster68/supermarket-inventory-tracker/releases/download/latest/main.pdf
    # always serves the current document. This runs only after the build job
    # succeeds (so lint and the artifact upload have already passed) and reuses the
    # PDF the build produced via the uploaded artifact. It runs on the host runner
    # rather than the TeX Live container because the gh CLI used below ships on the
    # runner image but is not present in that container. Real submission releases
    # (e.g. first-draft) are tagged by hand and are out of scope here.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only this job needs write access; everything else stays on the read-only
    # default declared at the top of the file.
    permissions:
      contents: write
    # Serialize the main-branch publish so two quick merges cannot race on the
    # delete-and-recreate of the single "latest" release; never cancel one in flight.
    concurrency:
      group: latest-release
      cancel-in-progress: false
    steps:
      - name: Download the built main.pdf
        uses: actions/download-artifact@v4
        with:
          name: main-pdf

      - name: Publish main.pdf to the rolling "latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          gh release create latest main.pdf \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build of main" \
            --notes "Built from $GITHUB_SHA by run $GITHUB_RUN_ID. Rolling pre-release; use a dated release for submissions."
